<!DOCTYPE html>
<!-- 降级 fixture: data-log-url 指向 403 端点 (私有仓/登录墙/IP 配额形态)
     → 源级错误 tab + 诊断。 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>forbidden log endpoint</title>
<style>
  body { font: 13px/1.6 -apple-system, sans-serif; margin: 40px; }
  check-step { display: block; border: 1px solid #d1d9e0; border-radius: 8px; padding: 10px 14px; }
</style>
</head>
<body>
  <h1>job 43</h1>

        <summary class="CheckStep-header js-check-step-summary">Build and test</summary>
        <div class="js-checks-log-display"><div class="js-checks-log-display-container"></div></div>
      </details>
    </check-step>

</html>
